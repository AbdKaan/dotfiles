# Set reload config keybind to r
unbind r
bind r source-file ~/.tmux.conf

# Color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Set leader to C-s
set -g prefix C-s

# Set mouse support on
set -g mouse on

# vi keybinding support for copy mode on tmux (moving through terminal and copying texts)
set-window-option -g mode-keys vi

# Assign keybindings to copy mode vi because it didn't work by default
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel

# Set window indexes start by 1 because why would you start from 0?!?!
set -g base-index 1

# Movement between panes like vim keybinds (h-j-k-l)
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# Movement between windows without leader key
bind-key -n F1 select-window -t 1
bind-key -n F2 select-window -t 2
bind-key -n F3 select-window -t 3
bind-key -n F4 select-window -t 4
bind-key -n F5 select-window -t 5
bind-key -n F6 select-window -t 6

# Resize pane
bind-key -r -T prefix       M-Up              resize-pane -U 5
bind-key -r -T prefix       M-Down            resize-pane -D 5
bind-key -r -T prefix       M-Left            resize-pane -L 5
bind-key -r -T prefix       M-Right           resize-pane -R 5
bind-key -r -T prefix       C-Up              resize-pane -U
bind-key -r -T prefix       C-Down            resize-pane -D
bind-key -r -T prefix       C-Left            resize-pane -L
bind-key -r -T prefix       C-Right           resize-pane -R

# If you want the status bar at top
set-option -g status-position top

# Catppuccin config
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

#set -g status-left ""
#set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

